[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jscope"
dynamic = ["version"]
description = "Evidence-based JavaScript intelligence for bug bounty hunters and web app pentesters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammed Ali" }]
keywords = ["security", "bug-bounty", "pentest", "javascript", "static-analysis", "appsec", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
browser = ["playwright>=1.40"]
dev = ["pytest>=7", "PyYAML>=6.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/LIME1Star/JScope"
Issues = "https://github.com/LIME1Star/JScope/issues"
Changelog = "https://github.com/LIME1Star/JScope/blob/main/CHANGELOG.md"

[project.scripts]
jscope = "jscope.cli:main"

[tool.setuptools.dynamic]
version = { attr = "jscope.__version__" }

[tool.setuptools.packages.find]
include = ["jscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
